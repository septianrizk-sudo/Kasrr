<style>
/* Layout: aplikasi kasir satu halaman. Atas: judul + petugas. Tengah: konten tab (kasir = menu kiri, pesanan kanan di layar lebar). Bawah: tab bar tetap. */
:root{
  --bg:#F2F5F2; --surface:#FFFFFF; --surface2:#E7EDE8; --fg:#15201A; --muted:#58695F; --line:#D3DCD5;
  --accent:#1B6B55; --accent-fg:#FFFFFF; --accent-soft:#D8EBE3;
  --danger:#B8322A; --danger-soft:#F8E0DD; --warn:#8F5A00; --warn-soft:#FAEBC9;
  --shadow:0 1px 2px rgba(21,32,26,.08),0 4px 14px rgba(21,32,26,.06);
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1612; --surface:#17211B; --surface2:#212D26; --fg:#E6EEE8; --muted:#93A69A; --line:#2C3A32;
    --accent:#4DBF9C; --accent-fg:#06231A; --accent-soft:#163A2F;
    --danger:#F27C71; --danger-soft:#3B1E1B; --warn:#E8B64F; --warn-soft:#3A2D10;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#17211B; --surface2:#212D26; --fg:#E6EEE8; --muted:#93A69A; --line:#2C3A32;
  --accent:#4DBF9C; --accent-fg:#06231A; --accent-soft:#163A2F;
  --danger:#F27C71; --danger-soft:#3B1E1B; --warn:#E8B64F; --warn-soft:#3A2D10;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:0 calc(76px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance;line-height:1.2}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
small,.muted{color:var(--muted)}
small{font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;text-align:right}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:700px){.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=number],input[type=password],input[type=tel],input[type=date],select{
  width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:transparent}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.grow{flex:1 1 140px;min-width:0}
.grow strong{display:block;overflow-wrap:anywhere}
.right{margin-left:auto}
.num{font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border:0;background:transparent;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;min-width:0}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.kasir{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media(min-width:860px){.kasir{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}.col-cart{position:sticky;top:12px}}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mitem{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:84px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.mitem:active{transform:translateY(1px)}
.mitem b{font-family:var(--font-head);font-size:15px;overflow-wrap:anywhere}
.mitem span{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.mitem .tag{position:absolute;top:8px;right:8px}
.step{display:inline-flex;align-items:center;gap:2px;background:var(--surface2);border-radius:10px}
.step button{width:36px;height:36px;border:0;background:transparent;font-size:18px;font-weight:700;cursor:pointer;border-radius:10px}
.step span{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.sum{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.sum.total{font-family:var(--font-head);font-weight:800;font-size:20px;padding-top:8px;margin-top:4px;border-top:1px dashed var(--line)}
.note{font-size:12.5px;padding:8px 10px;border-radius:8px;background:var(--surface2);color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--accent-soft);color:var(--accent)}
.note.err{background:var(--danger-soft);color:var(--danger)}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);display:block}
.dots i.f{background:var(--accent)}
.stat{padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.stat small{display:block}
.stat b{font-family:var(--font-head);font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;text-align:right;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
.scroll-x{overflow-x:auto}
.crit-row .qty{color:var(--danger)}
.qty{font-family:var(--font-head);font-weight:700;font-variant-numeric:tabular-nums}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.tab{position:relative;border:0;background:transparent;border-radius:10px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer;min-width:0}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);background:var(--accent-soft)}
.tab .lock{position:absolute;top:3px;right:calc(50% - 20px);width:11px;height:11px;opacity:.7}
.tab .cnt{position:absolute;top:2px;right:calc(50% - 22px);background:var(--danger);color:#fff;border-radius:999px;min-width:16px;height:16px;font-size:10.5px;display:flex;align-items:center;justify-content:center;padding:0 4px}
#modal{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(8,14,11,.55)}
.sheet{position:relative;background:var(--surface);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.rcpt{font-family:var(--font-mono);font-size:12.5px;line-height:1.35;background:#fff;color:#111;border:1px dashed #aaa;border-radius:8px;padding:12px;margin:0;overflow-x:auto;white-space:pre}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.toast.err{background:var(--danger);color:#fff}
.hint{font-size:13px;color:var(--muted)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 8px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:18px;height:18px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 36px;gap:8px;align-items:center}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}
textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px;font-family:var(--font-mono);font-size:12px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>

  <header class="top">
    <div class="brand"><h1 id="shopName">Kasir Kopi</h1><small id="opBadge">Belum ada petugas dipilih</small></div>
    <div class="clock" id="clock"></div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>

<script>
/* ============ Util & data ============ */
const KEY='kasirkopi.v1';
const LOCKED=['rekap','stok','atur'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const nf=n=>Number(n).toLocaleString('id-ID',{maximumFractionDigits:2});
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const r2=n=>Math.round(n*100)/100;
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)&&x>0?x:0};
function hash(s){let x=5381;for(const c of String(s))x=((x*33)^c.charCodeAt(0))>>>0;return 'h'+x.toString(36)+'-'+String(s).length}
const p2=n=>String(n).padStart(2,'0');
const dkey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const hm=ts=>{const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes())};
const dmy=ts=>{const d=new Date(ts);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)+' '+hm(ts)};
const today=()=>dkey(Date.now());
const isCrit=i=>i.stock<=i.min;

function seed(){
  const kopi=uid(),air=uid(),gula=uid(),susu=uid(),es=uid();
  return {v:1,seq:0,shop:'Kopi Kita',rewardAt:10,pin:hash('1234'),master:hash('888888'),pinDefault:true,masterDefault:true,
    operators:[{id:uid(),name:'Kasir Pagi'},{id:uid(),name:'Kasir Sore'}],
    ingredients:[
      {id:kopi,name:'Biji kopi',unit:'g',stock:1500,min:300},
      {id:air,name:'Air',unit:'ml',stock:8000,min:1500},
      {id:gula,name:'Gula',unit:'g',stock:1000,min:200},
      {id:susu,name:'Susu cair',unit:'ml',stock:4000,min:800},
      {id:es,name:'Es batu',unit:'g',stock:3000,min:500}],
    menu:[
      {id:uid(),name:'Kopi Tubruk',price:8000,cup:true,recipe:[{ing:kopi,qty:20},{ing:air,qty:225},{ing:gula,qty:13}]},
      {id:uid(),name:'Kopi Susu',price:15000,cup:true,recipe:[{ing:kopi,qty:18},{ing:susu,qty:120},{ing:gula,qty:10},{ing:es,qty:80}]},
      {id:uid(),name:'Americano',price:14000,cup:true,recipe:[{ing:kopi,qty:18},{ing:air,qty:200},{ing:es,qty:90}]}],
    customers:{},tx:[],op:'',campaigns:[{id:uid(),name:'Gratis 1 cup',cost:10,type:'free',menuId:'',value:0,active:true,from:'',to:''},{id:uid(),name:'Diskon 10%',cost:5,type:'pct',menuId:'',value:10,active:true,from:'',to:''}]};
}
let S=null,memOnly=false;
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.menu)&&Array.isArray(o.ingredients))return o}}catch(e){memOnly=true}
  return seed();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){memOnly=true;banner()}}

/* ============ Logika inti (murni) ============ */
function calcCart(cart,disc,menu){
  const lines=[];let sub=0,cups=0;
  for(const id in cart){
    const m=menu.find(x=>x.id===id);const q=cart[id];
    if(!m||!(q>0))continue;
    lines.push({id,name:m.name,price:m.price,qty:q});sub+=m.price*q;if(m.cup!==false)cups+=q;
  }
  const max=disc.type==='pct'?100:sub;
  const v=Math.min(Math.max(0,disc.val||0),max);
  let d=disc.type==='pct'?Math.round(sub*v/100):Math.round(v);
  d=Math.min(d,sub);
  return {lines,sub,cups,disc:d,total:Math.max(0,sub-d),max,clamped:(disc.val||0)>max};
}
function stampStep(current,cups,T){
  const t=current+cups;const rewards=T>0?Math.floor(t/T):0;
  return {rewards,after:t-rewards*T};
}
function deductStock(st,menuId,qty){
  const m=st.menu.find(x=>x.id===menuId);if(!m)return;
  for(const r of m.recipe){
    const ing=st.ingredients.find(i=>i.id===r.ing);if(!ing)continue;
    ing.stock=Math.max(0,r2(ing.stock-r.qty*qty));
  }
}
function canMake(st,m){
  if(!m.recipe.length)return 999;
  let n=Infinity;
  for(const r of m.recipe){const ing=st.ingredients.find(i=>i.id===r.ing);if(!ing||!(r.qty>0))continue;n=Math.min(n,Math.floor(ing.stock/r.qty))}
  return n===Infinity?999:n;
}
function normPhone(s){
  let d=String(s||'').replace(/\D/g,'');
  if(d.startsWith('62'))d='0'+d.slice(2);
  return d;
}
const maskPhone=p=>p.length>=8?p.slice(0,4)+'****'+p.slice(-3):p;
function summarize(list){
  const o={omzet:0,cups:0,free:0,disc:0,n:list.length,ops:{}};
  for(const t of list){
    o.omzet+=t.total;o.cups+=t.cups;o.free+=(t.free||[]).length;o.disc+=t.disc;
    const k=t.op||'-';const g=o.ops[k]||(o.ops[k]={n:0,cups:0,omzet:0,disc:0});
    g.n++;g.cups+=t.cups;g.omzet+=t.total;g.disc+=t.disc;
  }
  return o;
}
function receiptText(t,st){
  const W=32,line='-'.repeat(W);
  const row=(l,r)=>{l=String(l);r=String(r);return l.slice(0,Math.max(1,W-r.length-1)).padEnd(W-r.length)+r};
  const ctr=s=>' '.repeat(Math.max(0,Math.floor((W-s.length)/2)))+s;
  const L=[ctr(st.shop),line,'No '+String(t.no).padStart(4,'0')+'  '+dmy(t.ts),'Kasir: '+t.op,line];
  for(const i of t.items)L.push(row(i.qty+'x '+i.name,nf(i.price*i.qty)));
  for(const f of t.free||[])L.push(row('1x '+f,'GRATIS'));
  L.push(line,row('Subtotal',nf(t.sub)));
  const man=t.disc-(t.rewardDisc||0);
  if(man>0)L.push(row('Diskon'+(t.discType==='pct'?' '+nf(t.discVal)+'%':''),'-'+nf(man)));
  for(const r of t.redeemed||[])if(r.amount>0)L.push(row('Reward '+r.name,'-'+nf(r.amount)));
  L.push(row('TOTAL',nf(t.total)));
  if(t.cash>0){L.push(row('Tunai',nf(t.cash)));L.push(row('Kembali',nf(t.change)))}
  if(t.phone){
    L.push(line,'HP: '+maskPhone(t.phone),row('Stempel didapat','+'+t.cups));
    if(t.spent>0)L.push(row('Stempel ditukar','-'+t.spent));
    L.push(row('Saldo stempel',String(t.stampsAfter)));
    if((t.unlocked||[]).length){const w='Bisa ditukar: '+t.unlocked.join(', ');for(let i=0;i<w.length;i+=W)L.push(w.slice(i,i+W))}
  }
  L.push(line,ctr('Terima kasih'),'','');
  return L.join('\n');
}
function csvOf(list){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['No','Tanggal','Jam','Petugas','Item','Subtotal','Diskon','Total','Cup','Cup gratis','No HP','Tunai']];
  for(const t of list)rows.push([t.no,t.date,hm(t.ts),t.op,t.items.map(i=>i.qty+'x '+i.name).join('; '),t.sub,t.disc,t.total,t.cups,(t.free||[]).length,t.phone||'',t.cash||'']);
  const s=summarize(list);
  rows.push([],['','','','','TOTAL',list.reduce((a,t)=>a+t.sub,0),s.disc,s.omzet,s.cups,s.free,'','']);
  return '﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');
}
function reportLines(list,title,st){
  const s=summarize(list),L=[];
  const wrap=(t)=>{while(t.length>92){L.push(t.slice(0,92));t='    '+t.slice(92)}L.push(t)};
  L.push(title,'Dibuat: '+dmy(Date.now()),'='.repeat(60),
    'Omzet            : '+rp(s.omzet),'Transaksi        : '+s.n,'Cup terjual       : '+s.cups,
    'Cup gratis reward: '+s.free,'Total diskon      : '+rp(s.disc),'','Per petugas:');
  for(const k in s.ops){const g=s.ops[k];wrap('  '+k+' | trx '+g.n+' | cup '+g.cups+' | omzet '+rp(g.omzet)+' | diskon '+rp(g.disc))}
  L.push('','Transaksi:');
  for(const t of list)wrap('#'+String(t.no).padStart(4,'0')+' '+t.date+' '+hm(t.ts)+' '+t.op+' | '+t.items.map(i=>i.qty+'x '+i.name).join(', ')+' | disk '+rp(t.disc)+' | total '+rp(t.total));
  const crit=st.ingredients.filter(isCrit);
  if(crit.length){L.push('','Stok kritis:');crit.forEach(i=>L.push('  '+i.name+': '+nf(i.stock)+' '+i.unit+' (batas '+nf(i.min)+')'))}
  return L;
}
function makePdf(lines){
  const clean=s=>String(s).replace(/[^\x20-\x7E]/g,'?').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  const per=60,pages=[];
  for(let i=0;i<lines.length;i+=per)pages.push(lines.slice(i,i+per));
  if(!pages.length)pages.push(['']);
  const objs=[];
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>';
  const kids=[];let n=4;
  for(const p of pages){
    const cid=n,pid=n+1;n+=2;
    let s='BT /F1 9 Tf 12 TL 40 800 Td\n';
    for(const l of p)s+='('+clean(l)+') Tj T*\n';
    s+='ET';
    objs[cid]='<< /Length '+s.length+' >>\nstream\n'+s+'\nendstream';
    objs[pid]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents '+cid+' 0 R /Resources << /Font << /F1 3 0 R >> >> >>';
    kids.push(pid+' 0 R');
  }
  objs[2]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+kids.length+' >>';
  let out='%PDF-1.4\n';const offs=[];
  for(let i=1;i<objs.length;i++){offs[i]=out.length;out+=i+' 0 obj\n'+objs[i]+'\nendobj\n'}
  const x=out.length;
  out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
  for(let i=1;i<objs.length;i++)out+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  out+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';
  const b=new Uint8Array(out.length);for(let i=0;i<out.length;i++)b[i]=out.charCodeAt(i)&255;
  return b;
}

function pay(){
  const err=m=>{$('#payErr').innerHTML='<div class="note err">'+esc(m)+'</div>'};
  $('#payErr').innerHTML='';
  const op=S.operators.find(o=>o.id===S.op);
  if(!op)return err('Pilih nama petugas shift dulu.');
  pruneRedeem();
  const c=calcFull(cart,disc,S.menu,redeem,S.campaigns);
  if(!c.lines.length)return err('Pesanan masih kosong.');
  const ph=normPhone(phoneIn);
  if(ph&&ph.length<9)return err('Nomor HP tidak valid.');
  const cash=num(cashIn);
  if(cash>0&&cash<c.total)return err('Uang diterima kurang dari total.');
  finalize();
}
function finalize(){
  const c=calcFull(cart,disc,S.menu,redeem,S.campaigns);
  const op=S.operators.find(o=>o.id===S.op);
  const ph=normPhone(phoneIn);const cash=num(cashIn);const ts=Date.now();
  S.seq++;
  let after=0,unlocked=[];
  if(ph){
    const cur=S.customers[ph]||{stamps:0,total:0,rewards:0};
    const before=cur.stamps-c.spent;
    after=before+c.cups;
    S.customers[ph]={stamps:after,total:cur.total+c.cups,rewards:(cur.rewards||0)+c.rlist.length,last:ts};
    unlocked=S.campaigns.filter(k=>campActive(k,ts)&&k.cost<=after&&k.cost>before).map(k=>k.name);
  }
  for(const l of c.lines)deductStock(S,l.id,l.qty);
  const freeNames=[];
  for(const f of c.frees){freeNames.push(f.name);deductStock(S,f.id,1)}
  const tx={id:uid(),no:S.seq,ts,date:dkey(ts),op:op.name,items:c.lines.map(l=>({id:l.id,name:l.name,price:l.price,qty:l.qty})),free:freeNames,
    sub:c.sub,discType:disc.type,discVal:disc.val||0,disc:c.disc+c.rewardDisc,rewardDisc:c.rewardDisc,redeemed:c.rlist,spent:c.spent,unlocked,
    total:c.total,cups:c.cups,phone:ph,stampsAfter:after,rewards:c.rlist.length,cash:cash||0,change:cash>0?cash-c.total:0};
  S.tx.push(tx);save();
  cart={};redeem=[];disc={type:disc.type,val:0};phoneIn='';cashIn='';lastTx=tx;
  closeModal();render();showReceipt(tx);autoPrint(tx);
  if(unlocked.length)toast('Stempel cukup untuk: '+unlocked.join(', '));
}

function migrate(o){
  if(!Array.isArray(o.campaigns))o.campaigns=[{id:uid(),name:'Gratis 1 cup',cost:o.rewardAt||10,type:'free',menuId:'',value:0,active:true,from:'',to:''}];
  return o;
}
function calcFull(cart,disc,menu,rd,camps){
  const c=calcCart(cart,disc,menu);
  let rdisc=0,spent=0;const frees=[],rlist=[];
  for(const r of (rd||[])){
    const k=(camps||[]).find(x=>x.id===r.cid);if(!k)continue;
    if(k.type==='free'){
      const m=menu.find(x=>x.id===(k.menuId||r.menuId));if(!m)continue;
      frees.push({id:m.id,name:m.name});rlist.push({cid:k.id,name:k.name,cost:k.cost,amount:0,free:m.name});
    }else{
      const base=c.sub-c.disc-rdisc;
      let a=k.type==='pct'?Math.round(base*Math.min(k.value,100)/100):Math.round(k.value);
      a=Math.max(0,Math.min(a,base));rdisc+=a;rlist.push({cid:k.id,name:k.name,cost:k.cost,amount:a});
    }
    spent+=k.cost;
  }
  return Object.assign({},c,{rewardDisc:rdisc,total:Math.max(0,c.sub-c.disc-rdisc),frees,rlist,spent});
}
function campActive(k,ts){const d=dkey(ts);return !!k.active&&(!k.from||d>=k.from)&&(!k.to||d<=k.to)}
function campStatus(k){const t=today();if(!k.active)return['Nonaktif',''];if(k.to&&k.to<t)return['Berakhir','warn'];if(k.from&&k.from>t)return['Belum mulai','warn'];return['Aktif','ok']}
function campDesc(k){
  if(k.type==='free'){const m=S.menu.find(x=>x.id===k.menuId);return k.menuId&&m?'Gratis 1 '+m.name:'Gratis 1 cup (pilih menu saat tukar)'}
  return k.type==='pct'?'Diskon '+nf(k.value)+'%':'Potongan '+rp(k.value);
}
function custBal(){const p=normPhone(phoneIn);return p.length>=9&&S.customers[p]?S.customers[p].stamps:0}
function pruneRedeem(){
  if(normPhone(phoneIn).length<9){redeem=[];return}
  let bal=custBal();const keep=[];
  for(const r of redeem){const k=S.campaigns.find(x=>x.id===r.cid);if(!k||!campActive(k,Date.now())||k.cost>bal)continue;bal-=k.cost;keep.push(r)}
  redeem=keep;
}
function cupOptions(sel){return S.menu.filter(m=>m.cup!==false).map(m=>'<option value="'+m.id+'"'+(m.id===sel?' selected':'')+'>'+esc(m.name)+'</option>').join('')}
function rewardBox(){
  if(normPhone(phoneIn).length<9)return '';
  const act=S.campaigns.filter(k=>campActive(k,Date.now()));
  if(!act.length)return '';
  const spent=redeem.reduce((a,r)=>{const k=S.campaigns.find(x=>x.id===r.cid);return a+(k?k.cost:0)},0);
  const avail=custBal()-spent;
  return '<div class="card" style="padding:10px;box-shadow:none"><div class="lbl">Tukar stempel (sisa '+avail+')</div>'+act.map(k=>{
    const on=redeem.find(r=>r.cid===k.id);const can=on||k.cost<=avail;
    return '<div class="row" style="padding:8px 0"><div class="grow"><strong>'+esc(k.name)+'</strong><small>'+k.cost+' stempel &middot; '+esc(campDesc(k))+'</small>'+
      (on&&k.type==='free'&&!k.menuId?'<select data-rwm="'+k.id+'" aria-label="Menu gratis" style="margin-top:6px;height:38px">'+cupOptions(on.menuId)+'</select>':'')+'</div>'+

/* ============ Printer Bluetooth (ESC/POS) ============ */
const PRN_SERVICES=['000018f0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','0000fee7-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455'];
const prnOn=()=>!!(prn.ch&&prn.dev&&prn.dev.gatt&&prn.dev.gatt.connected);
const prnSupport=()=>typeof navigator!=='undefined'&&!!navigator.bluetooth;
function prnLabel(){return 'Printer: '+(prnOn()?esc(prn.name):'belum dipilih')}
function renderPrnBtn(){const b=$('#prnBtn');if(b)b.innerHTML=prnLabel()}
function prnModal(msg,kind){
  const sup=prnSupport();
  modal('<h3>Printer thermal Bluetooth</h3>'+
    (msg?'<div class="note '+(kind||'')+'">'+esc(msg)+'</div>':'')+
    '<div class="note '+(prnOn()?'ok':'')+'">Status: '+(prnOn()?'terhubung ke '+esc(prn.name):'belum terhubung')+'</div>'+
    (sup?'':'<div class="note warn">Bluetooth tidak tersedia di tampilan ini. Tombol pilih printer akan aktif di versi aplikasi Android (APK/PWA) atau Chrome Android di luar halaman ini.</div>')+
    '<p class="hint" style="margin:0">Nyalakan printer, ketuk Pilih printer, lalu pilih namanya dari daftar. Setelah terhubung, struk tercetak otomatis saat Bayar &amp; simpan.</p>'+
    '<button class="btn primary block" data-act="prnpick"'+(sup?'':' disabled')+'>Pilih printer</button>'+
    (prnOn()?'<div class="grid2"><button class="btn" data-act="prntest">Tes cetak</button><button class="btn" data-act="prnforget">Putuskan</button></div>':'')+
    '<button class="btn block" data-act="mclose">Tutup</button>');
}
async function prnPick(){
  if(!prnSupport()){prnModal('Bluetooth tidak tersedia di tampilan ini.','err');return}
  try{
    const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:PRN_SERVICES});
    const srv=await dev.gatt.connect();
    let ch=null;
    for(const s of await srv.getPrimaryServices()){
      ch=(await s.getCharacteristics()).find(c=>c.properties.write||c.properties.writeWithoutResponse);
      if(ch)break;
    }
    if(!ch){dev.gatt.disconnect();prnModal('Printer terhubung, tetapi jalur cetaknya tidak ditemukan. Coba printer lain.','err');return}
    prn={dev,ch,name:dev.name||'Printer'};
    dev.addEventListener('gattserverdisconnected',renderPrnBtn);
    renderPrnBtn();prnModal('Terhubung ke '+prn.name+'. Coba Tes cetak.','ok');
  }catch(e){
    prnModal(e&&e.name==='NotFoundError'?'Pemilihan printer dibatalkan.':'Bluetooth ditolak atau tidak tersedia di tampilan ini ('+((e&&e.name)||'error')+').','err');
  }
}
function escpos(text){
  const body=[...String(text).replace(/[^\x0A\x20-\x7E]/g,'?')].map(c=>c.charCodeAt(0));
  return new Uint8Array([0x1B,0x40,...body,0x0A,0x0A,0x0A]);
}
async function prnWrite(text){
  if(!prnOn())throw new Error('off');
  const data=escpos(text),c=prn.ch;
  for(let i=0;i<data.length;i+=100){
    const chunk=data.slice(i,i+100);
    if(c.properties.writeWithoutResponse)await c.writeValueWithoutResponse(chunk);else await c.writeValue(chunk);
    await new Promise(r=>setTimeout(r,25));
  }
}
function autoPrint(tx){
  if(!prnOn())return;
  prnWrite(receiptText(tx,S)).then(()=>toast('Struk dicetak')).catch(()=>toast('Gagal mencetak. Cek printer, struk tetap tersimpan.',true));
}

  campnew:()=>campForm(),
  campedit:t=>campForm(S.campaigns.find(k=>k.id===t.dataset.id)),
  campdel:t=>{const id=t.dataset.id;const k=S.campaigns.find(x=>x.id===id);confirmBox('Hapus campaign "'+k.name+'"? Saldo stempel pelanggan tidak berubah.',()=>{S.campaigns=S.campaigns.filter(x=>x.id!==id);save();render()},'Hapus')},
  printer:()=>prnModal(),
  prnpick:()=>prnPick(),
  prnforget:()=>{try{if(prn.dev&&prn.dev.gatt.connected)prn.dev.gatt.disconnect()}catch(e){}prn={dev:null,ch:null,name:''};renderPrnBtn();prnModal('Printer diputuskan.','ok')},
  prntest:async()=>{try{await prnWrite('TES CETAK\n'+S.shop+'\n--------------------------------\nPrinter siap dipakai\n');toast('Tes cetak dikirim')}catch(e){toast('Gagal mencetak. Cek printer.',true)}},
  prnrcpt:async()=>{if(!lastTx)return;if(!prnOn()){prnModal('Pilih printer dulu, lalu cetak ulang struk dari menu Rekap.');return}try{await prnWrite(receiptText(lastTx,S));toast('Struk dicetak')}catch(e){toast('Gagal mencetak. Cek printer.',true)}},
  menuedit:t=>menuForm(S.menu.find(m=>m.id===t.dataset.id)),
  menudel:t=>{const id=t.dataset.id;const m=S.menu.find(x=>x.id===id);confirmBox('Hapus menu "'+m.name+'"?',()=>{S.menu=S.menu.filter(x=>x.id!==id);delete cart[id];S.campaigns.forEach(k=>{if(k.menuId===id)k.menuId=''});save();render()},'Hapus')},
  rradd:()=>{$('#rrows').insertAdjacentHTML('beforeend',recipeRow(S.ingredients[0].id,''))},
  rrdel:t=>{t.closest('.rrow').remove()},
  opdel:t=>{const id=t.dataset.id;const o=S.operators.find(x=>x.id===id);confirmBox('Hapus operator "'+o.name+'"? Riwayat transaksi lama tetap tersimpan.',()=>{S.operators=S.operators.filter(x=>x.id!==id);if(S.op===id)S.op='';save();render()},'Hapus')},
  pinreset:()=>{pinStep={n:0,old:'',nw:''};$('#pinBox').innerHTML=pinBoxHtml();$('#ps').focus()},
  backup:()=>deliver('cadangan-kasir-'+today()+'.json',JSON.stringify(S))
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e)}});

/* ============ Form submit ============ */
const okPin=s=>/^\d{4,6}$/.test(s);
const F={
  pin:f=>{
    const v=f.pin.value;
    if(hash(v)===S.pin)unlockTo(pendingTab);else askPin('PIN salah. Coba lagi.');
  },
  'master-reset':f=>{
    if(hash(f.mc.value)===S.master){S.pin=hash('1234');S.pinDefault=true;save();unlockTo(pendingTab);toast('PIN direset ke 1234. Segera ganti.')}
    else $('#mcErr').innerHTML='<div class="note err">Master Code salah.</div>';
  },
  ing:f=>{
    const name=f.name.value.trim();if(!name)return;
    const o={name,unit:f.unit.value,stock:num(f.stock.value),min:num(f.min.value)};
    if(f.id.value){Object.assign(S.ingredients.find(i=>i.id===f.id.value),o)}else S.ingredients.push(Object.assign({id:uid()},o));
    save();closeModal();render();
  },
  restock:f=>{const i=S.ingredients.find(x=>x.id===f.id.value);i.stock=r2(i.stock+num(f.amt.value));save();closeModal();render();toast('Stok '+i.name+' bertambah')},
  menu:f=>{
    const name=f.name.value.trim();if(!name)return;
    const fd=new FormData(f),ri=fd.getAll('ri'),rq=fd.getAll('rq');
    const merged={};ri.forEach((id,k)=>{const q=num(rq[k]);if(q>0)merged[id]=r2((merged[id]||0)+q)});
    const recipe=Object.keys(merged).map(id=>({ing:id,qty:merged[id]}));
    const o={name,price:Math.round(num(f.price.value)),cup:f.cup.checked,recipe};
    if(f.id.value){Object.assign(S.menu.find(m=>m.id===f.id.value),o)}else S.menu.push(Object.assign({id:uid()},o));
    save();closeModal();render();
  },
  camp:f=>{
    const name=f.name.value.trim();if(!name)return;
    const type=f.type.value;const cost=Math.max(1,Math.round(num(f.cost.value))||1);
    let value=num(f.value.value);if(type==='pct')value=Math.min(100,value);
    if(type!=='free'&&value<=0){toast('Isi nilai diskon',true);return}
    const o={name,cost,type,menuId:type==='free'?f.menu.value:'',value:type==='free'?0:value,active:f.active.checked,from:f.from.value,to:f.to.value};
    if(o.from&&o.to&&o.to<o.from){toast('Tanggal akhir lebih awal dari tanggal mulai',true);return}
    if(f.id.value)Object.assign(S.campaigns.find(x=>x.id===f.id.value),o);else S.campaigns.push(Object.assign({id:uid()},o));
    save();closeModal();render();
  },
  shop:f=>{S.shop=f.shop.value.trim()||'Kasir Kopi';save();toast('Pengaturan disimpan');render()},
  op:f=>{const n=f.name.value.trim();if(!n)return;if(S.operators.some(o=>o.name.toLowerCase()===n.toLowerCase())){toast('Nama sudah ada',true);return}S.operators.push({id:uid(),name:n});save();render()},
  master:f=>{const m=f.mc.value;if(m.length<6){toast('Master Code minimal 6 karakter',true);return}S.master=hash(m);S.masterDefault=false;save();toast('Master Code disimpan');render()},
  pinstep:f=>{
    const v=f.v.value,err=m=>{$('#psErr').innerHTML='<div class="note err">'+esc(m)+'</div>'};
    if(pinStep.n===0){if(hash(v)!==S.pin)return err('PIN lama salah.');pinStep.old=v;pinStep.n=1}
    else if(pinStep.n===1){if(!okPin(v))return err('PIN harus 4 sampai 6 angka.');pinStep.nw=v;pinStep.n=2}
    else{
      if(v!==pinStep.nw)return err('Konfirmasi tidak sama dengan PIN baru.');
      S.pin=hash(v);S.pinDefault=false;save();pinStep={n:0,old:'',nw:''};toast('PIN berhasil diganti');render();return;
    }
    $('#pinBox').innerHTML=pinBoxHtml();$('#ps').focus();
  }
};
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;const h=F[f.dataset.form];if(h)h(f)});

/* ============ Input & change ============ */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='discVal'){
    const c=calcCart(cart,disc,S.menu);let v=parseFloat(t.value);v=isFinite(v)&&v>0?v:0;
    disc.val=v;
    if(v>c.max){t.value=c.max}
    updateCart();
  }else if(t.id==='phone'){phoneIn=t.value;updateCart()}
  else if(t.id==='cash'){cashIn=t.value;updateCart()}
  else if(t.id==='sq'){stampQ=t.value;fillStamps()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='opSel'){S.op=t.value;save();renderTabs()}
  else if(t.dataset&&t.dataset.rwm){const r=redeem.find(x=>x.cid===t.dataset.rwm);if(r){r.menuId=t.value;updateCart()}}
  else if(t.id==='campType')campToggle();
  else if(t.id==='rkDate'){rk.date=t.value;render()}
  else if(t.id==='rkOp'){rk.op=t.value;render()}
  else if(t.id==='restoreIn'&&t.files&&t.files[0]){
    const file=t.files[0];const fr=new FileReader();
    fr.onload=()=>{
      try{const o=JSON.parse(fr.result);if(!o||!Array.isArray(o.menu)||!Array.isArray(o.ingredients)||!Array.isArray(o.operators))throw 0;
        confirmBox('Timpa semua data saat ini dengan isi cadangan ini?',()=>{S=migrate(o);save();toast('Data dipulihkan');render()},'Pulihkan')}
      catch(err){toast('File cadangan tidak valid',true)}
    };
    fr.readAsText(file);t.value='';
  }
});

/* ============ Init ============ */
function tick(){const d=new Date();const el=$('#clock');if(el)el.textContent=d.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function init(){
  S=migrate(load());
  if(!S.op||!S.operators.some(o=>o.id===S.op))S.op='';
  render();tick();setInterval(tick,30000);
  try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{downloads=d||false}).catch(()=>{downloads=false})}catch(e){downloads=false}
}
init();
</script>
